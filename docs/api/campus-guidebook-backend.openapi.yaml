openapi: 3.0.3
info:
  title: Campus & Guidebook Backend API (Draft)
  version: 0.1.0-draft
  description: >
    ⚠️ 설계 제안(draft) 스펙 — 아직 구현되지 않았음. 실제 구현 시 이 파일을 최신화할 것.
    학교 지도·실제 경로 안내(길찾기, 자체 제작 지도)와 가이드북 대시보드(계층 문서 뷰어)를
    담당하는 신규 독립 FastAPI 서비스. LLM/임베딩 의존성 없음 (CPU 서버로 충분).
    챗봇 백엔드(chatbot-backend.openapi.yaml)와는 문서집·인프라 모두 완전히 분리되어 있으며,
    프론트엔드가 이 서비스를 직접 호출한다 (챗봇 백엔드를 경유하지 않음).
servers:
  - url: "http://<content-backend-host>:8002"
    description: 캠퍼스·가이드북 백엔드 (CPU, 별도 신규 서비스)

paths:
  /documents/tree:
    get:
      summary: 가이드북 문서 계층 트리 조회
      description: 가이드북 전용 마크다운 문서집(챗봇 RAG 문서와 별도)을 기반으로 트리 생성
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tree]
                properties:
                  tree:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocTreeNode"

  /documents/{doc_id}:
    get:
      summary: 가이드북 문서 원문 조회
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: doc_id에 해당하는 문서 없음

  /campus/map:
    get:
      summary: 캠퍼스 지도 이미지 + POI 목록 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [map_image_url, width, height, pois]
                properties:
                  map_image_url:
                    type: string
                    description: 자체 제작 캠퍼스 지도 이미지 URL
                  width:
                    type: integer
                    description: 지도 이미지 픽셀 너비 (POI 좌표계 기준)
                  height:
                    type: integer
                  pois:
                    type: array
                    items:
                      $ref: "#/components/schemas/Poi"

  /campus/route:
    post:
      summary: 두 지점 간 실제 경로(길찾기) 계산
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_poi_id, to_poi_id]
              properties:
                from_poi_id:
                  type: string
                to_poi_id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [distance_m, estimated_minutes, path]
                properties:
                  distance_m:
                    type: number
                    format: float
                  estimated_minutes:
                    type: number
                    format: float
                  path:
                    type: array
                    description: 지도 좌표계 기준 경로 폴리라인 포인트
                    items:
                      $ref: "#/components/schemas/MapPoint"
        "404":
          description: from_poi_id 또는 to_poi_id가 존재하지 않음
        "422":
          description: 두 지점 사이에 연결된 경로가 없음 (그래프 단절)

components:
  schemas:
    DocTreeNode:
      type: object
      required: [id, title, type]
      properties:
        id:
          type: string
          description: type이 document이면 doc_id, category면 카테고리 슬러그
        title:
          type: string
        type:
          type: string
          enum: [category, document]
        children:
          type: array
          items:
            $ref: "#/components/schemas/DocTreeNode"

    DocumentDetail:
      type: object
      required: [doc_id, title, body_md]
      properties:
        doc_id:
          type: string
        title:
          type: string
        source_url:
          type: string
          default: ""
        category:
          type: string
          default: ""
        body_md:
          type: string
          description: 원문 마크다운 본문 (클라이언트에서 렌더링)

    Poi:
      type: object
      required: [id, name, category, x, y]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          description: "예: building, facility, gate 등"
        x:
          type: number
          description: 지도 이미지 좌표계 기준 x
        y:
          type: number

    MapPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
