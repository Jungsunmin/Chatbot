services:
  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend_dev
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface_cache:
